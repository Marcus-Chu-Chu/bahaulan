name: Daily pipeline

on:
  schedule:
    - cron: "0 22 * * *"   # 06:00 Asia/Manila
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pipeline
        run: python -m pipeline.run
      - name: Commit snapshots, exports, log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw exports logs
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "pipeline: run ${RUN_DATE}"
            git push
          fi
      - name: Publish extracts to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest extracts" --notes "Rolling release: dashboard extracts refreshed by the daily pipeline."
          gh release upload latest exports/dashboard.hyper exports/dashboard.parquet exports/dashboard.csv exports/metadata.json --clobber
      - name: Upload run artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exports-${{ env.RUN_DATE }}
          path: exports/
          retention-days: 14
